name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch pytest mypy build wheel cython numpy
        python -m build --wheel
        pip install dist/*.whl

    - name: Security Audit
      run: |
        ! grep -rnw 'astra_guard/' -e '0.15' -e '1e-6' -e '1e-7'

    - name: Static Type Checking
      run: |
        mypy astra_guard/hooks.py

    - name: Run Test Suite
      env:
        PYTHONPATH: .
      run: |
        set -e
        python setup.py build_ext --inplace
        pytest tests/test_binary_security.py -v
        pytest tests/test_adversarial_robustness.py -v
        pytest tests/test_stress_and_concurrency.py -v
