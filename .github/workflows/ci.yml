name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel cython pytest torch numpy mypy psutil

    - name: Build C-extensions
      run: |
        python setup.py build_ext --inplace

    - name: Install Package
      run: |
        pip install -e .

    - name: Security Audit
      run: |
        ! grep -rnw '.' --exclude-dir='.git' --exclude='*.pyx' --exclude='*.cpp' --exclude='ci.yml' -e '0.15' -e '1e-6' -e '1e-7'

    - name: Static Type Checking
      run: |
        mypy --ignore-missing-imports astra_guard/export.py astra_guard/telemetry.py astra_guard/hooks.py

    - name: Run Test Suite
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v
